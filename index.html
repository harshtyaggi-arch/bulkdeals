  <style>
    :root {
      --bg: #0b0b12;
      --card: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.09);
      --text: #ffffff;
      --muted: #a9a9bc;
      --accent: #ff7a1a;
      --accent-2: #ffcf3f;
      --telegram: #229ed9;
      --telegram-dark: #1a85b8;
      --whatsapp: #25d366;
      --whatsapp-dark: #1eb257;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
      overflow-x: hidden;
      position: relative;
    }

    /* soft glowing background */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }
    body::before { background: var(--accent); top: -180px; left: -160px; }
    body::after  { background: #7c3aed; bottom: -200px; right: -180px; }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 24px 32px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      animation: rise 0.6s ease-out both;
    }

    .logo {
      width: 128px;
      height: 128px;
      margin: 0 auto 22px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 40px rgba(255, 122, 26, 0.35);
    }
    .logo img,
    .logo .fallback {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #15151f;
    }
    .logo .fallback {
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: 1px;
      color: var(--accent-2);
    }

    h1 {
      font-size: clamp(26px, 7vw, 34px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 18px;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #ff5a5a;
      background: rgba(255, 90, 90, 0.1);
      border: 1px solid rgba(255, 90, 90, 0.25);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    .live .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff5a5a;
      animation: pulse 1.4s infinite;
    }

    h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p.sub {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      margin: 0 auto 28px;
      max-width: 340px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn svg { width: 24px; height: 24px; flex-shrink: 0; }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0) scale(0.98); }

    .btn.telegram {
      background: var(--telegram);
      box-shadow: 0 10px 30px rgba(34, 158, 217, 0.35);
    }
    .btn.telegram:hover { background: var(--telegram-dark); }

    .btn.whatsapp {
      background: var(--whatsapp);
      box-shadow: 0 10px 30px rgba(37, 211, 102, 0.3);
    }
    .btn.whatsapp:hover { background: var(--whatsapp-dark); }

    footer {
      margin-top: 26px;
      font-size: 12px;
      color: var(--muted);
      opacity: 0.8;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(255, 90, 90, 0.7); }
      70%  { box-shadow: 0 0 0 8px rgba(255, 90, 90, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 90, 90, 0); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
